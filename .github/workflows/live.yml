name: quorum-live

on:
  repository_dispatch:
    types: [tick] # PEMICU UTAMA: cron-job.org → POST /repos/rfypych/quorum/dispatches {"event_type":"tick"} — dispatch API SELALU menciptakan run; cron internal GitHub terukur me-drop ~90% tick saat sibuk (2 hari: ~7 dari 96 tick/hari nyala)
  schedule:
    - cron: "4,19,34,49 * * * *" # cadangan otomatis; kapan pun nyala, catch-up menutup lubang. Run ganda di jendela sama aman: concurrency mengantri, run kedua jadi heartbeat idle (0 candle baru)
  workflow_dispatch: {} # tombol manual di tab Actions

permissions:
  contents: write

concurrency:
  group: quorum-live
  cancel-in-progress: false # antre, jangan saling bunuh (record = append-only)

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sanitasi plumbing
        run: python tests/test_plumbing.py
      - name: catch-up paper loop (auto-beli uang virtual)
        run: python live_catchup.py
      - name: commit record
        run: |
          git config user.name "quorum-bot"
          git config user.email "quorum-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan record"
          else
            git commit -m "live: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push || (git pull --rebase --autostash && git push)
          fi
